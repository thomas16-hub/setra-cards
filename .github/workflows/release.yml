name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests (release gate)
        run: python -m pytest tests -q

      - name: Guard — tag must match package __version__
        shell: pwsh
        run: |
          python -c "import os, sys; from setra_cards import __version__; tag = os.environ['GITHUB_REF_NAME']; expected = 'v' + __version__; print(f'tag={tag} expected={expected}'); sys.exit(0 if tag == expected else 1)"

      - name: Download Flet desktop client (for offline-friendly bundle)
        shell: pwsh
        run: |
          $ver = python -c "import flet_desktop; print(flet_desktop.version.version)"
          $url = "https://github.com/flet-dev/flet/releases/download/v$ver/flet-windows.zip"
          New-Item -ItemType Directory -Force -Path build_exe/flet_client | Out-Null
          Invoke-WebRequest -Uri $url -OutFile build_exe/flet_client/flet-windows.zip
          Write-Host "Flet client v$ver descargado"

      - name: Download CP210x USB driver (Silicon Labs VCP)
        shell: pwsh
        run: |
          $url = "https://www.silabs.com/documents/public/software/CP210x_Universal_Windows_Driver.zip"
          New-Item -ItemType Directory -Force -Path build_exe/drivers | Out-Null
          Invoke-WebRequest -Uri $url -OutFile build_exe/drivers/CP210x.zip
          Expand-Archive -Path build_exe/drivers/CP210x.zip -DestinationPath build_exe/drivers/CP210x -Force
          Remove-Item build_exe/drivers/CP210x.zip
          Write-Host "Driver CP210x preparado"

      - name: Build with PyInstaller
        run: pyinstaller build_exe/setra-cards.spec --noconfirm --clean

      - name: Assemble distribution
        shell: pwsh
        run: |
          $stage = "dist/Setra-CARDS-Release"
          Copy-Item -Recurse -Force "dist/Setra-CARDS" $stage
          Copy-Item "build_exe/Instalar.bat" $stage
          Copy-Item "build_exe/Desinstalar.bat" $stage
          Copy-Item "build_exe/LEEME.txt" $stage
          Copy-Item -Recurse "hoteles" "$stage/hoteles"
          Copy-Item -Recurse "build_exe/drivers" "$stage/drivers"
          Compress-Archive -Path $stage -DestinationPath "dist/setra-cards-$env:GITHUB_REF_NAME.zip" -Force

      - name: Compute SHA-256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/setra-cards-$env:GITHUB_REF_NAME.zip" -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA-256: $hash"

      # The live update channel is a SIGNED manifest on portonsabaneta.com, NOT
      # GitHub Releases (the repo is private — anonymous API returns 404). This
      # CI only builds + hashes the artifact. Signing the manifest happens
      # OFFLINE: the Ed25519 private key never enters CI. Print the exact
      # canonical message so the operator can sign it by hand.
      - name: Emit canonical message to sign offline
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $zip = "setra-cards-${{ github.ref_name }}.zip"
          $url = "https://portonsabaneta.com/setra-cards-flet/$zip"
          $sha = "${{ steps.sha.outputs.sha256 }}"
          $msg = "$ver|$url|$sha"
          Write-Host "=== Firmar OFFLINE (Ed25519 RFC 8032) este mensaje canonico ==="
          Write-Host $msg
          Write-Host "==============================================================="
          Write-Host "Luego: build_exe/make_manifest.py build -> latest.json -> FTP a /setra-cards-flet/"

      # Keep the artifact on the GitHub Release for archival/diagnostics, but the
      # APP never fetches it from here. PUBLISH manually:
      #   1) build_exe/make_manifest.py prepare  -> imprime el mensaje canonico
      #   2) firmar OFFLINE con la llave privada en ~/.claude/credentials
      #   3) build_exe/make_manifest.py build    -> genera latest.json
      #   4) subir por FTP el .zip + latest.json a /setra-cards-flet/ en portonsabaneta.com
      # NUNCA subir la llave privada a ningun lado.
      - name: Archive build artifact (NOT the live channel)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/setra-cards-*.zip
          body: |
            ## Setra CARDS ${{ github.ref_name }}

            Artefacto de build (archivo/diagnostico). El canal de actualizacion
            EN VIVO es el manifest firmado en
            `https://portonsabaneta.com/setra-cards-flet/latest.json`.

            Publicar: firmar OFFLINE el mensaje canonico
            `version|url|sha256`, generar `latest.json` con
            `build_exe/make_manifest.py build`, y subir por FTP el `.zip` +
            `latest.json` a `/setra-cards-flet/`.

            sha256: ${{ steps.sha.outputs.sha256 }}
          draft: false
          prerelease: false
